<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Arenası - Şampiyonlar Ligi</title>
    <style>
        body { font-family: 'Fredoka One', 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); min-height: 100vh; color: #333; display: flex; flex-direction: column; align-items: center; user-select: none; }
        
        .header { background: white; padding: 15px 30px; border-radius: 20px; box-shadow: 0 8px 0 rgba(0,0,0,0.1); border: 4px solid #333; margin-bottom: 20px; text-align: center; }
        h1 { color: #8e44ad; margin: 0; text-shadow: 2px 2px 0px #e8daef; font-size: 32px; }
        
        input { padding: 10px; font-size: 18px; border-radius: 10px; border: 3px solid #ddd; outline: none; font-weight: bold; text-align: center; margin: 10px; }
        button.login-btn { padding: 10px 20px; font-size: 18px; background: #f39c12; color: white; border: 3px solid #d35400; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #d35400; }
        button.login-btn:active { transform: translateY(5px); box-shadow: 0 0px 0; }

        .main-container { display: flex; width: 100%; max-width: 1200px; gap: 20px; }
        .game-grid { flex: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .game-card { background: white; border-radius: 15px; padding: 15px; border: 4px solid #333; cursor: pointer; box-shadow: 0 8px 0 #333; text-align: center; transition: transform 0.1s; }
        .game-card:hover { transform: translateY(-5px); }
        .game-icon { font-size: 40px; margin-bottom: 5px; }
        .game-title { font-size: 18px; font-weight: bold; }
        
        .c-green { background: #55efc4; }
        .c-blue { background: #74b9ff; }
        .c-dark { background: #2d3436; color: white; }
        .c-orange { background: #ffeaa7; }

        .leaderboard-panel { flex: 1; background: #ffffff; border: 4px solid #333; border-radius: 20px; box-shadow: 0 10px 0 #333; padding: 20px; max-height: 500px; overflow-y: auto; }
        .lb-title { font-size: 24px; color: #d35400; text-align: center; margin-top: 0; border-bottom: 3px dashed #ddd; padding-bottom: 10px; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 2px solid #f1f2f6; font-size: 18px; font-weight: bold; }
        .score-badge { background: #2ecc71; color: white; padding: 5px 10px; border-radius: 10px; font-size: 14px; border: 2px solid #27ae60; }
        
        #game-container { display: none; width: 100%; max-width: 800px; background: #1a1a2e; border: 4px solid #333; border-radius: 20px; box-shadow: 0 10px 0 rgba(0,0,0,0.3); overflow: hidden; position: relative; padding: 20px; text-align: center; color: white;}
        .back-lobby-btn { background: #e74c3c; color: white; border: 3px solid #c0392b; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏆 MATEMATİK ARENASI 🏆</h1>
        <div id="profile-section">
            <input type="text" id="playerName" placeholder="Adını Yaz!">
            <button class="login-btn" onclick="saveProfile()">Giriş Yap</button>
        </div>
        <h2 id="welcome-message" style="display:none; color: #27ae60; margin:10px 0 0 0;"></h2>
    </div>

    <button id="back-btn" class="back-lobby-btn" onclick="returnToLobby()">✖ Lobisine Dön</button>

    <div class="main-container" id="main-ui">
        <!-- AÇIK KAYNAK OYUN KÜTÜPHANESİ -->
        <div class="game-grid">
            <div class="game-card c-green" onclick="launchGame('monty')">
                <div class="game-icon">🐐</div>
                <div class="game-title">3 Kapı İllüzyonu</div>
            </div>
            <div class="game-card c-blue" onclick="launchGame('math2048')">
                <div class="game-icon">🔢</div>
                <div class="game-title">Matematik 2048</div>
            </div>
            <div class="game-card c-orange" onclick="launchGame('balloons')">
                <div class="game-icon">🎈</div>
                <div class="game-title">Hızlı İşlem Balonları</div>
            </div>
            <div class="game-card c-dark" onclick="launchGame('vault')">
                <div class="game-icon">🔒</div>
                <div class="game-title">Algoritma Kasası</div>
            </div>
        </div>

        <!-- LİDERLİK TABLOSU -->
        <div class="leaderboard-panel">
            <h2 class="lb-title">⭐ Günün Şampiyonları ⭐</h2>
            <div id="leaderboard-list">
                <div style="text-align:center; color:#7f8c8d;">Henüz oynayan yok... İlk sen ol!</div>
            </div>
        </div>
    </div>

    <div id="game-container"></div>

<script>
    let currentUser = localStorage.getItem("bilmath_user") || "";
    
    if(currentUser) {
        document.getElementById('profile-section').style.display = "none";
        document.getElementById('welcome-message').style.display = "block";
        document.getElementById('welcome-message').innerHTML = "Selam, <b>" + currentUser + "</b>! 👋";
    }

    function saveProfile() {
        let name = document.getElementById('playerName').value;
        if(name.trim() === "") return;
        currentUser = name;
        localStorage.setItem("bilmath_user", currentUser); 
        location.reload();
    }

    function updateLeaderboard() {
        let scores = JSON.parse(localStorage.getItem("bilmath_scores")) || {};
        let listDiv = document.getElementById('leaderboard-list');
        let players = Object.keys(scores).map(name => ({ name: name, score: scores[name].score || 0 }));
        players.sort((a, b) => b.score - a.score);
        
        if(players.length > 0) listDiv.innerHTML = "";
        players.forEach((p, index) => {
            let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🎓";
            listDiv.innerHTML += `
                <div class="player-row">
                    <span>${medal} ${p.name}</span>
                    <span class="score-badge">Skor: ${p.score}</span>
                </div>
            `;
        });
    }

    function launchGame(type) {
        if(!currentUser) { alert("Lütfen adını yazarak giriş yap!"); return; }
        document.getElementById('main-ui').style.display = "none";
        document.getElementById('back-btn').style.display = "block";
        let container = document.getElementById('game-container');
        container.style.display = "block";
        
        if(type === 'monty') loadMontyHall(container);
        else if(type === 'math2048') loadMath2048(container);
        else if(type === 'balloons') loadBalloons(container);
        else if(type === 'vault') loadVault(container);
    }

    function returnToLobby() {
        document.getElementById('game-container').style.display = "none";
        document.getElementById('game-container').innerHTML = "";
        document.getElementById('back-btn').style.display = "none";
        document.getElementById('main-ui').style.display = "flex";
        updateLeaderboard();
    }

    function saveScore(points) {
        let scores = JSON.parse(localStorage.getItem("bilmath_scores")) || {};
        if(!scores[currentUser]) scores[currentUser] = { score: 0 };
        if(points > scores[currentUser].score) scores[currentUser].score = points;
        localStorage.setItem("bilmath_scores", JSON.stringify(scores));
    }

    // --- 1. OYUN: 3 KAPI ---
    function loadMontyHall(container) {
        container.innerHTML = `
            <h2>🐐 3 KAPI İLLÜZYONU 🚗</h2>
            <p id="mh-text">Araba olan kapıyı seç!</p>
            <div style="display:flex; justify-content:center; gap:20px; margin:30px 0;">
                <button onclick="mhPick(0)" id="mh-0" style="padding:40px 30px; font-size:30px; cursor:pointer;">1</button>
                <button onclick="mhPick(1)" id="mh-1" style="padding:40px 30px; font-size:30px; cursor:pointer;">2</button>
                <button onclick="mhPick(2)" id="mh-2" style="padding:40px 30px; font-size:30px; cursor:pointer;">3</button>
            </div>
            <div id="mh-decision" style="display:none;">
                <button onclick="mhFinal(false)" style="padding:10px 20px; background:#3498db; color:white; font-size:18px; border:none; border-radius:5px; cursor:pointer;">Aynı Kapıda Kal</button>
                <button onclick="mhFinal(true)" style="padding:10px 20px; background:#2ecc71; color:white; font-size:18px; border:none; border-radius:5px; cursor:pointer;">Kararını Değiştir</button>
            </div>`;
        window.mhCar = Math.floor(Math.random() * 3);
        window.mhSelected = -1; window.mhOpened = -1;
    }
    window.mhPick = function(idx) {
        window.mhSelected = idx;
        window.mhOpened = [0,1,2].find(i => i !== window.mhSelected && i !== window.mhCar);
        document.getElementById(`mh-${window.mhOpened}`).innerText = "🐐";
        document.getElementById('mh-text').innerText = "Sunucu keçiyi açtı! Kararını değiştirmek ister misin?";
        document.getElementById('mh-decision').style.display = "block";
    }
    window.mhFinal = function(change) {
        let final = change ? [0,1,2].find(i => i !== window.mhSelected && i !== window.mhOpened) : window.mhSelected;
        let win = (final === window.mhCar);
        document.getElementById('mh-text').innerHTML = win ? "🎉 TEBRİKLER, ARABAYI BULDUN! (+10 Puan) 🎉" : "Maalesef keçi çıktı! 🐐";
        if(win) { saveScore(10); updateLeaderboard(); }
        [0,1,2].forEach(i => document.getElementById(`mh-${i}`).innerText = (i === window.mhCar ? "🚗" : "🐐"));
        document.getElementById('mh-decision').style.display = "none";
    }

    // --- 2. OYUN: MATEMATİK 2048 (Açık Kaynak Mantık) ---
    function loadMath2048(container) {
        container.innerHTML = `
            <h2>🔢 MATEMATİKSEL 2048</h2>
            <p>Aynı sayıları birleştir, üslü sayılarda zirveye çık! (Kullanım: Yön tuşları veya ekrandaki butonlar)</p>
            <div id="m2-board" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:300px; margin:20px auto; background:#bbada0; padding:10px; border-radius:10px;"></div>
            <p style="font-size:24px;">Skor: <span id="m2-score">0</span></p>`;
        // Basit simüle edilmiş 2048 arayüz motoru
        let board = [2, 0, 0, 2,  0, 4, 0, 0,  0, 0, 8, 0,  2, 0, 0, 0];
        let score = 0;
        window.render2048 = () => {
            let html = "";
            board.forEach(n => {
                let bg = n === 0 ? "#cdc1b4" : n === 2 ? "#eee4da" : n === 4 ? "#ede0c8" : "#f2b179";
                html += `<div style="background:${bg}; height:60px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; color:#776e65; border-radius:5px;">${n === 0 ? '' : n}</div>`;
            });
            document.getElementById('m2-board').innerHTML = html;
            document.getElementById('m2-score').innerText = score;
        };
        window.render2048();
        // Basit etkileşim simülasyonu
        container.onclick = () => {
            score += 4;
            board[Math.floor(Math.random()*16)] = 2;
            window.render2048();
            saveScore(score);
        };
    }

    // --- 3. OYUN: HIZLI İŞLEM BALONLARI (Akıllı Tahta İçin) ---
    function loadBalloons(container) {
        container.innerHTML = `
            <h2>🎈 HIZLI İŞLEM BALONLARI</h2>
            <p id="b-task" style="font-size:22px; color:#ffeaa7;">Görev: <b>12</b> sayısını veren balona dokun!</p>
            <div id="b-area" style="height:350px; background:#0984e3; border-radius:10px; position:relative; overflow:hidden; cursor:pointer;" onclick="balloonClick(event)">
                <div style="position:absolute; bottom:50px; left:100px; font-size:40px; background:#ff7675; padding:15px; border-radius:50%;">12</div>
                <div style="position:absolute; bottom:100px; right:150px; font-size:40px; background:#55efc4; padding:15px; border-radius:50%;">15</div>
            </div>
            <p style="font-size:22px;">Patlatılan Balon: <span id="b-score">0</span></p>`;
        window.bSc = 0;
        window.balloonClick = (e) => {
            window.bSc++;
            document.getElementById('b-score').innerText = window.bSc;
            saveScore(window.bSc * 5);
            document.getElementById('b-task').innerText = "Harika! Yeni Görev: 24 sayısını bul!";
        };
    }

    // --- 4. OYUN: ALGORİTMA KASASI ---
    function loadVault(container) {
        container.innerHTML = `
            <h2>🔒 ALGORİTMA KASASI</h2>
            <div style="font-size:32px; color:#f1c40f; margin:20px;" id="v-q">EBOB(12, 18)</div>
            <input type="number" id="v-input" placeholder="Cevap..." style="font-size:24px; width:150px;"><br><br>
            <button onclick="vCheck()" style="padding:10px 25px; font-size:20px; background:#2ecc71; color:white; border:none; border-radius:8px; cursor:pointer;">KİLİDİ AÇ</button>
            <p style="font-size:20px;">Açılan Kasa: <span id="v-score">0</span></p>`;
        window.vAns = 6; window.vSc = 0;
        window.vGen = () => {
            let a = Math.floor(Math.random() * 8) + 2;
            let b = Math.floor(Math.random() * 8) + 2;
            const gcd = (x, y) => (!y ? x : gcd(y, x % y));
            window.vAns = gcd(a*2, b*2);
            document.getElementById('v-q').innerText = `EBOB(${a*2}, ${b*2})`;
        };
        window.vGen();
        window.vCheck = () => {
            let val = parseInt(document.getElementById('v-input').value);
            if(val === window.vAns) {
                window.vSc++;
                document.getElementById('v-score').innerText = window.vSc;
                document.getElementById('v-input').value = "";
                saveScore(window.vSc * 10);
                window.vGen();
            } else {
                alert("Yanlış şifre! Tekrar dene.");
            }
        }
    }

    updateLeaderboard();
</script>
</body>
</html>
